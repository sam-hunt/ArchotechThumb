name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build ArchotechThumb.sln -c Release

      - name: Package mod
        run: |
          set -e
          VERSION=${GITHUB_REF_NAME}
          mkdir -p release/ArchotechThumb/About
          mkdir -p release/ArchotechThumb/1.6/Assemblies
          mkdir -p release/ArchotechThumb/1.6/Defs
          cp About/About.xml release/ArchotechThumb/About/
          [ -f About/ModIcon.png ] && cp About/ModIcon.png release/ArchotechThumb/About/ || true
          [ -f About/Preview.png ] && cp About/Preview.png release/ArchotechThumb/About/ || true
          cp LoadFolders.xml release/ArchotechThumb/
          cp 1.6/Assemblies/ArchotechThumb.dll release/ArchotechThumb/1.6/Assemblies/
          [ -d 1.6/Defs ] && [ "$(ls -A 1.6/Defs)" ] && cp -r 1.6/Defs/* release/ArchotechThumb/1.6/Defs/ || true
          [ -d 1.6/Patches ] && [ "$(ls -A 1.6/Patches)" ] && cp -r 1.6/Patches release/ArchotechThumb/1.6/ || true
          [ -d Textures ] && cp -r Textures release/ArchotechThumb/ || true
          cd release && zip -r ../ArchotechThumb-${VERSION}.zip ArchotechThumb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArchotechThumb-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, '-rc') }}
